name: Deploy Noxus

on:
  push:
    branches:
      - dev
  
jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Yarn
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies (Yarn)
        run: yarn install --frozen-lockfile
          
      - name: Build React (yarn)
        run: |
          CI=false yarn build

      - name: Upload build to Noxus server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "build/*"
          target: "/home/${{ secrets.SERVER_USER }}/pgn-crm-fe/build"

      - name: Restart pm2 on Noxus server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            pm2 restart pgn-fe