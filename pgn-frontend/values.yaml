service:
  enabled: false
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: 
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/client-body-buffer-size: 1024K
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # nginx.ingress.kubernetes.io/rewrite-target: /$2
    # nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: dev-energy.pgn.co.id
      paths:
        - path: /
          pathType: Prefix
          serviceName: pgn-frontend
          servicePort: 80

        # - path: /rbi(/|$)(.*)
        #   pathType: ImplementationSpecific
        #   serviceName: rbi-management
        #   servicePort: 8903
        #   annotations:
        #     nginx.ingress.kubernetes.io/rewrite-target: /$2

        # - path: /payment(/|$)(.*)
        #   pathType: ImplementationSpecific
        #   serviceName: dbs-module-payment
        #   servicePort: 8905
        #   annotations:
        #     nginx.ingress.kubernetes.io/rewrite-target: /$2

        # - path: /acc(/|$)(.*)
        #   pathType: ImplementationSpecific
        #   serviceName: dbs-module-account
        #   servicePort: 8902
        #   annotations:
        #     nginx.ingress.kubernetes.io/rewrite-target: /$2

        # - path: /rabbitmq(/|$)(.*)
        #   pathType: ImplementationSpecific
        #   serviceName: rabbitmq
        #   servicePort: 15672 # port management nginx biasanya ini
        #   annotations:
        #     nginx.ingress.kubernetes.io/rewrite-target: /$2

        # - path: /ig(/|$)(.*)
        #   pathType: ImplementationSpecific
        #   serviceName: integration-service
        #   servicePort: 8903
        #   annotations:
        #     nginx.ingress.kubernetes.io/rewrite-target: /$2
  tls:
    - secretName: tls-secret
      hosts:
        - dev-energy.pgn.co.id


resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 1
    memory: 128Mi
