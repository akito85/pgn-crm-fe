# Default values for dbs-module-account.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: "pgn-frontend"
fullnameOverride: "pgn-frontend"

replicaCount: 1
deployment:
  enabled: true

image:
  name: "imagePath"
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  name: ""
#nameOverride: ""
#fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"
#
podAnnotations:
  releaseNamespace: "default"
  vault:
    enabled: false
    authPath: ""
    role: "default"
    access_path: ""
    secretPath: "energy-development/db_access"
    inject: "update"
    access_properties_un: spring.crm-datasource.userName={{ .Data.data.username }}
    access_properties_pw: spring.crm-datasource.password={{ .Data.data.password }}
